<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="胶片调色">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#141412">
<title>胶片调色</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
[hidden] { display: none !important; }
body { margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
/* Layout: darkroom workbench — a large print on the left, a film-box rack and dials on the right; stacks on phones. Single dark look by choice (photo work reads best on dark). */
:root {
  color-scheme: dark;
  --bg: #141412;
  --surface: #1d1d1a;
  --line: #34332e;
  --fg: #ecebe4;
  --muted: #9b998f;
  --accent: #e0893a;      /* safelight amber */
  --accent-ink: #1a1206;
  --font-display: "Barlow Condensed", "Arial Narrow", "Noto Sans SC", sans-serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --r: 6px;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font-body); font-size: 14px; line-height: 1.6; }
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 30px; letter-spacing: .04em; text-wrap: balance; }
h1 span { color: var(--accent); }
.sub { margin: 0; color: var(--muted); font-size: 13px; }
.bench { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
@media (max-width: 860px) { .bench { grid-template-columns: minmax(0, 1fr); } }

/* Print / stage */
.stage-col { display: grid; gap: 10px; min-width: 0; }
.stage { position: relative; background: #0b0b0a; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: ew-resize; min-height: 200px; display: grid; place-items: center; }
.stage canvas { display: block; max-width: 100%; max-height: 72vh; width: auto; height: auto; }
.stage #after { position: absolute; }
.split { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--fg); box-shadow: 0 0 0 1px rgba(0,0,0,.35); pointer-events: none; }
.split::after { content: ""; position: absolute; top: 50%; left: 50%; width: 26px; height: 26px; transform: translate(-50%,-50%); border-radius: 50%; background: var(--fg); box-shadow: 0 1px 6px rgba(0,0,0,.5); }
.tag { position: absolute; top: 10px; font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; background: rgba(10,10,9,.66); color: var(--fg); padding: 2px 8px; border-radius: 3px; pointer-events: none; }
.tag.l { left: 10px; } .tag.r { right: 10px; }
.drop-hint { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(224,137,58,.18); border: 2px dashed var(--accent); font-weight: 700; pointer-events: none; }
.status { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.status b { color: var(--fg); font-weight: 500; }

/* Panel */
.panel { display: grid; gap: 18px; min-width: 0; }
.group { display: grid; gap: 10px; }
.label { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.label output { color: var(--fg); font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: 500 14px var(--font-body); padding: 10px 12px; border-radius: var(--r); cursor: pointer; text-align: center; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: progress; }
.btn:focus-visible, .film:focus-visible, input:focus-visible + .seg-face, input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Film-box rack */
.films { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 860px) { .films { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 480px) { .films { grid-template-columns: 1fr 1fr; } }
.film-group { grid-column: 1 / -1; font-size: 12px; color: var(--muted); padding-top: 6px; }
.film-group:first-child { padding-top: 0; }
.film { appearance: none; text-align: left; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: var(--r); padding: 0; overflow: hidden; display: grid; grid-template-rows: 6px auto; font: inherit; }
.film .band { background: linear-gradient(90deg, var(--c1) 0 50%, var(--c2) 50% 100%); }
.film .txt { padding: 7px 9px 8px; display: grid; gap: 1px; min-width: 0; }
.film .en { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.film .cn { font-size: 12px; color: var(--muted); }
.film[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.film[aria-pressed="true"] .cn { color: var(--fg); }
.desc { margin: 0; font-size: 13px; color: var(--muted); min-height: 3.2em; }

input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg label { position: relative; cursor: pointer; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg-face { display: block; text-align: center; padding: 6px 4px; font-size: 13px; color: var(--muted); }
.seg label + label .seg-face { border-left: 1px solid var(--line); }
.seg input:checked + .seg-face { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.note { margin: 0; font-size: 12px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: var(--r); font-size: 13px; max-width: calc(100% - 32px); }
.sheet { position: fixed; inset: 0; background: rgba(8,8,7,.92); display: grid; grid-template-rows: auto 1fr; gap: 10px; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 5; }
.sheet .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sheet img { max-width: 100%; max-height: 100%; margin: auto; object-fit: contain; min-height: 0; }
@media (prefers-reduced-motion: no-preference) { .film, .btn { transition: border-color .15s, box-shadow .15s, filter .15s; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>胶片<span>调色</span></h1>
    <p class="sub">富士胶片模拟和流行滤镜 · 照片只在你的设备上处理，不会上传</p>
  </header>

  <div class="bench">
    <div class="stage-col">
      <div class="stage" id="stage" aria-label="对比画面：左边原图，右边胶片效果，拖动可调整分界">
        <canvas id="before"></canvas>
        <canvas id="after"></canvas>
        <div class="split" id="split"></div>
        <span class="tag l">原图</span>
        <span class="tag r" id="tagR">Teal Neg</span>
        <div class="drop-hint" id="dropHint" hidden>松开以载入照片</div>
      </div>
      <div class="status">
        <span id="srcInfo">示例画面 · 选择照片后替换</span>
        <span>在画面上左右拖动对比原图</span>
      </div>
    </div>

    <aside class="panel">
      <div class="actions">
        <label class="btn" for="file">选择照片</label>
        <button class="btn primary" id="save" type="button">保存照片</button>
        <input id="file" type="file" accept="image/*" hidden>
      </div>

      <div class="group">
        <div class="label">滤镜</div>
        <div class="films" id="films" role="group" aria-label="滤镜"></div>
        <p class="desc" id="desc"></p>
      </div>

      <div class="group">
        <div class="label"><label for="strength">效果强度</label><output id="strengthOut">100%</output></div>
        <input type="range" id="strength" min="0" max="100" value="100">
      </div>

      <div class="group">
        <div class="label"><label for="warmth">白平衡偏移</label><output id="warmthOut">0</output></div>
        <input type="range" id="warmth" min="-9" max="9" value="0">
      </div>

      <div class="group">
        <div class="label"><span>颗粒效果</span></div>
        <div class="seg" role="radiogroup" aria-label="颗粒强度">
          <label><input type="radio" name="grain" id="grain0" value="0"><span class="seg-face">关</span></label>
          <label><input type="radio" name="grain" id="grain1" value="1" checked><span class="seg-face">弱</span></label>
          <label><input type="radio" name="grain" id="grain2" value="2"><span class="seg-face">强</span></label>
        </div>
        <div class="seg" role="radiogroup" aria-label="颗粒大小">
          <label><input type="radio" name="gsize" id="gsize1" value="1" checked><span class="seg-face">小颗粒</span></label>
          <label><input type="radio" name="gsize" id="gsize2" value="2"><span class="seg-face">大颗粒</span></label>
          <label><input type="radio" name="gsize" id="gsize3" value="3"><span class="seg-face">粗颗粒</span></label>
        </div>
      </div>

      <div class="group">
        <div class="label"><label for="clarity">清晰度</label><output id="clarityOut">35</output></div>
        <input type="range" id="clarity" min="0" max="100" value="35">
      </div>

      <div class="group">
        <div class="label"><label for="vignette">暗角</label><output id="vignetteOut">0</output></div>
        <input type="range" id="vignette" min="0" max="100" value="0">
      </div>

      <p class="note">色彩为近似模拟，不是相机原厂算法。保存时按原图分辨率导出（最长边上限 6000 像素），JPEG 格式。</p>
    </aside>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="sheet" id="sheet" hidden>
  <div class="bar"><span>长按图片保存到相册</span><button class="btn" id="sheetClose" type="button">关闭</button></div>
  <img id="sheetImg" alt="处理后的照片">
</div>

  // ---------- Math helpers ----------
  const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
  const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };

  // Monotone cubic (Fritsch–Carlson) curve baked into a 1024-entry table.
  function bakeCurve(pts) {
    const n = pts.length, xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    const d = [], m = new Array(n);
    for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
    m[0] = d[0]; m[n - 1] = d[n - 2];
    for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
    for (let i = 0; i < n - 1; i++) {
      if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; }
      const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
      if (s > 9) { const t = 3 / Math.sqrt(s); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }
    }
    const T = new Float32Array(1024);
    let k = 0;
    for (let j = 0; j < 1024; j++) {
      const x = j / 1023;
      while (k < n - 2 && x > xs[k + 1]) k++;
      const h = xs[k + 1] - xs[k], t = (x - xs[k]) / h, t2 = t * t, t3 = t2 * t;
      T[j] = (2*t3 - 3*t2 + 1) * ys[k] + (t3 - 2*t2 + t) * h * m[k] + (-2*t3 + 3*t2) * ys[k + 1] + (t3 - t2) * h * m[k + 1];
    }
    return x => T[Math.round(clamp(x) * 1023)];
  }

  function rgb2hsv(r, g, b) {
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), dd = mx - mn;

  }
  function hsv2rgb(h, s, v) {

  const luma = (r, g, b) => .2126 * r + .7152 * g + .0722 * b;

  // ---------- 3D LUT ----------
  const N = 33;
  function buildLUT(film, strength, warmth) {
    const curve = bakeCurve(film.curve);
    const wb = film.wb || [1, 1, 1];

    const st = film.shadowTint || [0, 0, 0], ht = film.highTint || [0, 0, 0];
    const lut = new Float32Array(N * N * N * 3);

    for (let bi = 0; bi < N; bi++) for (let gi = 0; gi < N; gi++) for (let ri = 0; ri < N; ri++) {
      const r0 = ri / (N - 1), g0 = gi / (N - 1), b0 = bi / (N - 1);
      let r = clamp(r0 * wr), g = clamp(g0 * wb[1]), b = clamp(b0 * wbb);
      let out;
      if (film.bw) {
        const L = curve(clamp(r * film.bw[0] + g * film.bw[1] + b * film.bw[2]));
        out = [L, L, L];
      } else {
        let [h, s, v] = rgb2hsv(r, g, b);
        let dh = 0, sm = 1, vm = 1;
        for (const [c, sh, smul, vmul] of film.hues) {
          let dist = Math.abs(h - c); if (dist > 180) dist = 360 - dist;
          const w = Math.exp(-(dist * dist) / (2 * 28 * 28)) * Math.min(1, s * 2.5);
          dh += sh * w; sm *= 1 + (smul - 1) * w; vm *= 1 + (vmul - 1) * w;
        }

        const L0 = luma(r, g, b);
        // "keep": selective colour — one hue range keeps its saturation, the rest fades.
        let sat = film.sat;

          const wk = Math.exp(-(dist * dist) / (2 * film.keep.width * film.keep.width));

        }
        r = L0 + (r - L0) * sat; g = L0 + (g - L0) * sat; b = L0 + (b - L0) * sat;
        out = [curve(r), curve(g), curve(b)];

      for (let c = 0; c < 3; c++) lut[p++] = clamp(orig[c] + (out[c] - orig[c]) * strength) * 255;

  }

  const IDX = new Uint8Array(256), FR = new Float32Array(256);
  for (let v = 0; v < 256; v++) { const x = v / 255 * (N - 1); IDX[v] = Math.min(N - 2, Math.floor(x)); FR[v] = x - IDX[v]; }

  function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  // Two passes of a separable running-sum box blur (close to a Gaussian).
  function boxBlur(src, W, H, r) {
    let a = src, b = new Float32Array(W * H);
    for (let pass = 0; pass < 2; pass++) {
      for (let y = 0; y < H; y++) {
        const o = y * W; let acc = 0;
        for (let x = -r; x <= r; x++) acc += a[o + Math.min(W - 1, Math.max(0, x))];
        for (let x = 0; x < W; x++) {
          b[o + x] = acc / (2 * r + 1);
          acc += a[o + Math.min(W - 1, x + r + 1)] - a[o + Math.max(0, x - r)];
        }
      }
      const c = new Float32Array(W * H);
      for (let x = 0; x < W; x++) {
        let acc = 0;
        for (let y = -r; y <= r; y++) acc += b[Math.min(H - 1, Math.max(0, y)) * W + x];
        for (let y = 0; y < H; y++) {
          c[y * W + x] = acc / (2 * r + 1);
          acc += b[Math.min(H - 1, y + r + 1) * W + x] - b[Math.max(0, y - r) * W + x];
        }
      }
      a = c;
    }

  }

  // Apply LUT + clarity + grain + vignette to ImageData in place.
  function render(img, lut, opts) {
    const { width: W, height: H, data: d } = img;

    const hal = (FILMS.find(f => f.id === opts.film) || {}).halation || 0;
    let lum = null, blur = null, glow = null;
    if (clar > 0 || hal > 0) {

      for (let p = 0, i = 0; p < W * H; p++, i += 4) lum[p] = d[i] * .2126 + d[i + 1] * .7152 + d[i + 2] * .0722;

    // Halation: red glow bleeding out of the brightest highlights (CineStill has no anti-halation layer).
    if (hal > 0) {
      const m = new Float32Array(W * H);
      for (let p = 0; p < W * H; p++) m[p] = sstep(205, 250, lum[p]);
      glow = boxBlur(m, W, H, Math.max(3, Math.round(long / 90)));

    for (let y = 0; y < H; y++) {
      const ny = y / cell, y0 = Math.floor(ny), fy = ny - y0;

            const c00 = lut[a] + (lut[a + S1] - lut[a]) * fr;
            const c10 = lut[a + S2] + (lut[a + S2 + S1] - lut[a + S2]) * fr;
            const c01 = lut[a + S3] + (lut[a + S3 + S1] - lut[a + S3]) * fr;
            const c11 = lut[a + S3 + S2] + (lut[a + S3 + S2 + S1] - lut[a + S3 + S2]) * fr;
            const c0 = c00 + (c10 - c00) * fg, c1 = c01 + (c11 - c01) * fg;
            c[k] = c0 + (c1 - c0) * fb;

        }
        if (glow) {
          const gv = glow[y * W + x] * hal * 255;
          o0 += gv * .75; o1 += gv * .18; o2 += gv * .05;

        }
        d[i] = o0; d[i + 1] = o1; d[i + 2] = o2;
      }
    }
  }

  // ---------- State & DOM ----------
  const $ = id => document.getElementById(id);
  const before = $("before"), after = $("after"), stage = $("stage"), split = $("split");
  const state = { film: "cozy", strength: 100, warmth: 0, clarity: 35, grain: 1, gsize: 1, vignette: 0, split: .5 };
  let srcCanvas = null, srcName = "sample", previewData = null, lutKey = "", lut = null;

  try { const saved = JSON.parse(localStorage.getItem("film-darkroom-v2") || "null"); if (saved) Object.assign(state, saved, { split: .5 }); } catch (e) {}

  const persist = () => { try { localStorage.setItem("film-darkroom-v2", JSON.stringify(state)); } catch (e) {} };

  const filmsEl = $("films");
  let lastGroup = "";
  for (const f of FILMS) {
    if (f.group !== lastGroup) {

      filmsEl.appendChild(h); lastGroup = f.group;
    }

  function syncUI() {
    const f = FILMS.find(x => x.id === state.film);
    for (const b of filmsEl.querySelectorAll(".film")) b.setAttribute("aria-pressed", b.dataset.id === state.film);
    $("desc").textContent = f.desc;
    $("tagR").textContent = f.en;
    $("strength").value = state.strength; $("strengthOut").textContent = state.strength + "%";
    $("warmth").value = state.warmth; $("warmthOut").textContent = (state.warmth > 0 ? "+" : "") + state.warmth + (state.warmth > 0 ? " 偏暖" : state.warmth < 0 ? " 偏冷" : "");
    $("clarity").value = state.clarity; $("clarityOut").textContent = state.clarity;
    $("vignette").value = state.vignette; $("vignetteOut").textContent = state.vignette;
    $("grain" + state.grain).checked = true; $("gsize" + state.gsize).checked = true;
  }

  for (const id of ["strength", "warmth", "clarity", "vignette"]) $(id).addEventListener("input", e => { state[id] = +e.target.value; syncUI(); schedule(); });
  document.querySelectorAll("input[name=grain]").forEach(r => r.addEventListener("change", e => { state.grain = +e.target.value; schedule(); }));
  document.querySelectorAll("input[name=gsize]").forEach(r => r.addEventListener("change", e => { state.gsize = +e.target.value; schedule(); }));

  function getLUT() {
    const key = [state.film, state.strength, state.warmth].join("|");
    if (key !== lutKey) { lut = buildLUT(FILMS.find(f => f.id === state.film), state.strength / 100, state.warmth); lutKey = key; }
    return lut;
  }

  let pending = false;
  function schedule() {
    persist();
    if (pending) return; pending = true;
    requestAnimationFrame(() => { pending = false; drawPreview(); });
  }

  function drawPreview() {
    if (!previewData) return;
    const img = new ImageData(new Uint8ClampedArray(previewData.data), previewData.width, previewData.height);
    render(img, getLUT(), state);
    after.getContext("2d").putImageData(img, 0, 0);
  }

  function setSplit(t) {
    state.split = clamp(t);
    after.style.clipPath = `inset(0 0 0 ${state.split * 100}%)`;
    const sr = stage.getBoundingClientRect(), cr = before.getBoundingClientRect();
    split.style.left = (cr.left - sr.left + cr.width * state.split - 1) + "px";
  }

  function loadSource(canvas, name, info) {
    srcCanvas = canvas; srcName = name;
    const W = canvas.width, H = canvas.height, maxP = 1600;
    const k = Math.min(1, maxP / Math.max(W, H));
    const pw = Math.round(W * k), ph = Math.round(H * k);
    for (const c of [before, after]) { c.width = pw; c.height = ph; }
    const bctx = before.getContext("2d");
    bctx.imageSmoothingQuality = "high";
    bctx.drawImage(canvas, 0, 0, pw, ph);
    previewData = bctx.getImageData(0, 0, pw, ph);
    $("srcInfo").innerHTML = "";
    const b = document.createElement("b"); b.textContent = info;
    $("srcInfo").append(b, document.createTextNode(` · ${W} × ${H}`));
    drawPreview();
    requestAnimationFrame(() => setSplit(state.split));
  }

  // ---------- Sample scene (procedural) ----------
  function sampleScene() {
    const W = 1500, H = 1000, c = document.createElement("canvas"); c.width = W; c.height = H;
    const g = c.getContext("2d");
    let gr = g.createLinearGradient(0, 0, 0, H * .55);
    gr.addColorStop(0, "#3d7fc4"); gr.addColorStop(1, "#cfe1ef"); g.fillStyle = gr; g.fillRect(0, 0, W, H);
    gr = g.createRadialGradient(W * .78, H * .2, 10, W * .78, H * .2, 260);
    gr.addColorStop(0, "rgba(255,248,225,1)"); gr.addColorStop(.15, "rgba(255,240,200,.85)"); gr.addColorStop(1, "rgba(255,240,200,0)");
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    g.fillStyle = "rgba(255,255,255,.75)";
    for (const [x, y, s] of [[260, 150, 1], [420, 120, .7], [1040, 300, .8]]) { g.beginPath(); for (let i = 0; i < 6; i++) g.ellipse(x + i * 38 * s, y + Math.sin(i) * 10, 60 * s, 30 * s, 0, 0, Math.PI * 2); g.fill(); }
    g.fillStyle = "#6f8aa6"; g.beginPath(); g.moveTo(0, 520); for (let x = 0; x <= W; x += 50) g.lineTo(x, 470 - Math.sin(x / 140) * 50 - Math.cos(x / 61) * 18); g.lineTo(W, 560); g.lineTo(0, 560); g.fill();
    gr = g.createLinearGradient(0, 520, 0, 700); gr.addColorStop(0, "#2f8f95"); gr.addColorStop(1, "#1f6a86"); g.fillStyle = gr; g.fillRect(0, 540, W, 160);
    g.fillStyle = "#4f8f3a"; g.beginPath(); g.moveTo(0, 560); g.quadraticCurveTo(250, 470, 520, 600); g.lineTo(520, H); g.lineTo(0, H); g.fill();
    g.fillStyle = "#2f6a2c"; for (let i = 0; i < 22; i++) { g.beginPath(); g.arc(40 + i * 22, 600 + (i % 4) * 30, 40 + (i % 3) * 12, 0, Math.PI * 2); g.fill(); }
    gr = g.createLinearGradient(0, 680, 0, H); gr.addColorStop(0, "#e2cfa6"); gr.addColorStop(1, "#c9a978"); g.fillStyle = gr;
    g.beginPath(); g.moveTo(480, H); g.quadraticCurveTo(700, 690, W, 690); g.lineTo(W, H); g.fill();
    g.fillStyle = "#5a3b22"; g.fillRect(1026, 560, 10, 300);
    g.fillStyle = "#d8352a"; g.beginPath(); g.moveTo(860, 600); g.quadraticCurveTo(1031, 470, 1202, 600); g.fill();
    g.fillStyle = "#f2f0ea"; g.beginPath(); g.moveTo(960, 600); g.quadraticCurveTo(1031, 488, 1102, 600); g.fill();
    g.fillStyle = "#d8352a"; g.beginPath(); g.moveTo(1000, 600); g.quadraticCurveTo(1031, 520, 1062, 600); g.fill();
    g.save(); g.translate(1100, 880); g.rotate(-.12); g.fillStyle = "#f2c230"; g.fillRect(-150, -40, 300, 80); g.fillStyle = "#2a63b8"; for (let i = 0; i < 5; i++) g.fillRect(-150 + i * 64, -40, 22, 80); g.restore();
    g.fillStyle = "#e3b08f"; g.beginPath(); g.arc(760, 800, 38, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#3a2a20"; g.beginPath(); g.arc(760, 788, 40, Math.PI, 0); g.fill();
    g.fillStyle = "#f5f5f2"; g.beginPath(); g.moveTo(705, 850); g.quadraticCurveTo(760, 830, 815, 850); g.lineTo(830, 990); g.lineTo(690, 990); g.fill();
    g.fillStyle = "#e8558e"; for (let i = 0; i < 9; i++) { g.beginPath(); g.arc(130 + i * 38, 900 + (i % 2) * 24, 12, 0, Math.PI * 2); g.fill(); }
    g.fillStyle = "#f6d24a"; for (let i = 0; i < 9; i++) { g.beginPath(); g.arc(150 + i * 38, 940 + (i % 2) * 18, 9, 0, Math.PI * 2); g.fill(); }
    return c;
  }

  // ---------- Loading photos ----------
  function loadFile(file) {
    if (!file || !/^image\//.test(file.type)) { toast("请选择图片文件（JPG、PNG、WEBP、HEIC 等）"); return; }
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      const maxE = 6000, k = Math.min(1, maxE / Math.max(im.naturalWidth, im.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      loadSource(c, file.name.replace(/\.[^.]+$/, "") || "photo", file.name);
    };
    im.onerror = () => { URL.revokeObjectURL(url); toast("这张图片无法读取。HEIC 格式可以先在相册里转成 JPG 再试。"); };
    im.src = url;
  }
  $("file").addEventListener("change", e => { loadFile(e.target.files[0]); e.target.value = ""; });
  stage.addEventListener("dragover", e => { e.preventDefault(); $("dropHint").hidden = false; });
  stage.addEventListener("dragleave", () => { $("dropHint").hidden = true; });
  stage.addEventListener("drop", e => { e.preventDefault(); $("dropHint").hidden = true; loadFile(e.dataTransfer.files[0]); });
  window.addEventListener("paste", e => { const f = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith("image/")); if (f) loadFile(f); });

  // ---------- Split drag ----------
  let dragging = false;
  const fromEvent = e => { const r = before.getBoundingClientRect(); setSplit((e.clientX - r.left) / r.width); };
  stage.addEventListener("pointerdown", e => { dragging = true; stage.setPointerCapture(e.pointerId); fromEvent(e); });
  stage.addEventListener("pointermove", e => { if (dragging) fromEvent(e); });
  stage.addEventListener("pointerup", () => { dragging = false; });
  stage.addEventListener("pointercancel", () => { dragging = false; });
  window.addEventListener("resize", () => setSplit(state.split));

  // ---------- Export ----------
  let toastT;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }

  let downloads = null;
  if (window.claude?.use) window.claude.use("downloads").then(d => { downloads = d; }).catch(() => {});

  $("save").addEventListener("click", async () => {
    if (!srcCanvas) return;
    const btn = $("save"); btn.disabled = true; btn.textContent = "处理中…";
    await new Promise(r => setTimeout(r, 30));
    try {
      const c = document.createElement("canvas"); c.width = srcCanvas.width; c.height = srcCanvas.height;
      const ctx = c.getContext("2d"); ctx.drawImage(srcCanvas, 0, 0);
      const img = ctx.getImageData(0, 0, c.width, c.height);
      render(img, getLUT(), state);
      ctx.putImageData(img, 0, 0);
      const blob = await new Promise(r => c.toBlob(r, "image/jpeg", .93));
      const f = FILMS.find(x => x.id === state.film);
      const filename = `${srcName}-${f.en.replace(/\s+/g, "")}.jpg`;
      if (downloads) {
        try { await downloads.save({ filename, data: blob }); toast("已保存 " + filename); }
        catch (err) {
          if (err?.code === "declined") toast("已取消保存");
          else showSheet(blob);
        }
      } else if (!window.claude) {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob); a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
        toast("已保存 " + filename);
      } else showSheet(blob);
    } catch (err) {
      toast("导出失败：图片可能太大，换一张较小的照片再试。");
    } finally { btn.disabled = false; btn.textContent = "保存照片"; }
  });

  let sheetURL = null;
  function showSheet(blob) {
    if (sheetURL) URL.revokeObjectURL(sheetURL);
    sheetURL = URL.createObjectURL(blob);
    $("sheetImg").src = sheetURL; $("sheet").hidden = false;
  }
  $("sheetClose").addEventListener("click", () => { $("sheet").hidden = true; });

  syncUI();
  loadSource(sampleScene(), "sample", "示例画面");
})();
</script>
